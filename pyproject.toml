[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-service"
version = "1.0.0"
description = "A RAG (Retrieval-Augmented Generation) service with knowledge base and memory bank"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "RAG Team" },
]

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",

    # Data validation
    "pydantic>=2.0.0",
    "pyyaml>=6.0",

    # Vector store
    "qdrant-client>=1.9.0",

    # HTTP client
    "httpx>=0.27.0",

    # Document parsing
    "markitdown>=0.1.0",

    # MCP (Model Context Protocol)
    "mcp>=1.0.0",

    # AI/ML (serving)
    "torch>=2.0.0",
    "FlagEmbedding>=1.3.0",
    "sentence-transformers>=3.0.0",

    # Scientific computing
    "numpy>=1.24.0",

    # Evaluation
    "beir>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
include = ["rag*"]
