global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8001"]
        labels:
          service: api

  - job_name: rag-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8004"]
        labels:
          service: worker
