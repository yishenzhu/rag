groups:
  - name: rag-api
    rules:
      - alert: RagApiDown
        expr: up{job="rag-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RAG API 抓取失败
          description: "{{ $labels.instance }} 已连续 2 分钟无法抓取。"

      - alert: RagApiHighErrorRate
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5..",route!="/metrics"}[5m]))
            / clamp_min(sum by (job) (rate(http_requests_total{route!="/metrics"}[5m])), 0.000001) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: RAG API 5xx 比例超过 5%
          description: "当前 5xx 比例 {{ $value | humanizePercentage }}。"

      - alert: RagApiHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_request_duration_seconds_bucket{route!="/metrics"}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RAG API P95 延迟超过 2 秒
          description: "当前 P95 为 {{ $value | humanizeDuration }}。"

      - alert: RagAuthFailureSpike
        expr: sum by (job) (rate(auth_failures_total[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 鉴权失败速率异常
          description: "当前 {{ $value | humanize }} 次/秒。"

  - name: rag-worker
    rules:
      - alert: RagWorkerDown
        expr: up{job="rag-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RAG worker 抓取失败
          description: "{{ $labels.instance }} 已连续 2 分钟无法抓取。"

      - alert: RagOutboxBacklog
        expr: max by (job) (outbox_pending{job="rag-worker"}) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Outbox 积压超过 1000 条
          description: "当前 {{ $value }} 条待投递。"

      - alert: RagOutboxStale
        expr: max by (job) (outbox_oldest_pending_seconds{job="rag-worker"}) > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 最老 Outbox 事件超过 5 分钟未投递
          description: "当前已等待 {{ $value | humanizeDuration }}。"

      - alert: RagOutboxPublishFailures
        expr: sum by (job) (rate(outbox_publish_failures_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Outbox 投递持续失败
          description: "当前 {{ $value | humanize }} 次/秒。"

      - alert: RagUsageFlushFailures
        expr: sum by (job) (rate(usage_flush_failures_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 用量落账持续失败
          description: "当前 {{ $value | humanize }} 次/秒。"

      - alert: RagMemoryPendingBacklog
        expr: sum by (job) (memories_by_status{status="pending",job="rag-worker"}) > 5000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 待索引记忆超过 5000 条
          description: "当前 {{ $value }} 条记忆处于 pending。"
